{% extends "bookmodule/lab10_master.html" %}

{% block content %}
    <h2>{{ task_title }}</h2>
    
    <div style="margin-bottom: 20px;">
        <a href="{% url 'add_book_no_form' %}" class="btn btn-success">Add New Book (No Form)</a>
    </div>

    {% if books %}
        <table border="1" cellpadding="10" style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr style="background-color: #f2f2f2;">
                    <th>ID</th>
                    <th>Title</th>
                    <th>Price</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for book in books %}
                    <tr>
                        <td>{{ book.id }}</td>
                        <td>{{ book.title }}</td>
                        <td>{{ book.price }}</td>
                        <td>
                            <a href="{% url 'edit_book_no_form' book.pk %}" style="color: blue;">Edit</a> | 
                            <a href="{% url 'delete_book_no_form' book.pk %}" style="color: red;">Delete</a>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>No books found.</p>
    {% endif %}
{% endblock %}
