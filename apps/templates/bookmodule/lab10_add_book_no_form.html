{% extends "bookmodule/lab10_master.html" %}

{% block content %}
    <h2>Add New Book (Manual Form)</h2>
    
    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 10px;">
            <label>Title:</label><br>
            <input type="text" name="title" required class="form-control">
        </div>
        
        <div style="margin-bottom: 10px;">
            <label>Author:</label><br>
            <input type="text" name="author" required class="form-control">
        </div>
        
        <div style="margin-bottom: 10px;">
            <label>Price:</label><br>
            <input type="number" step="0.01" name="price" required class="form-control">
        </div>

        <button type="submit" class="btn btn-primary">Save Book</button>
        <a href="{% url 'list_books_no_form' %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
