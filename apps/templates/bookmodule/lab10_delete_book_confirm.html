{% extends "bookmodule/lab10_master.html" %}

{% block content %}
    <div style="border: 1px solid red; padding: 20px; background-color: #ffe6e6;">
        <h2>Are you sure you want to delete "{{ obj_name }}"?</h2>
        <p>This action cannot be undone.</p>
        
        <form method="POST">
            {% csrf_token %}
            <button type="submit" style="color: white; background-color: red; padding: 10px;">Yes, Delete</button>
            <a href="{% url 'list_books_no_form' %}" style="margin-left: 20px;">Cancel</a>
        </form>
    </div>
{% endblock %}
